name: Deploy projects to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -R counter_app student_details site/
          touch site/.nojekyll

      - name: Build all Vite apps
        run: |
          build_app() {
            app="$1"
            output="$2"
            (
              cd "$app"
              npm ci
              npm run build -- --outDir "$GITHUB_WORKSPACE/site/$output"
            )
          }

          build_app "Attendence" "Attendence"
          build_app "Hobbies_card" "Hobbies_card"
          build_app "Todoform" "Todoform"
          build_app "formValidation" "formValidation"
          build_app "portfolio" "portfolio"
          build_app "report card/Report_card" "report card"
          build_app "simple_calculator" "simple_calculator"
          build_app "student_profile" "student_profile"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4