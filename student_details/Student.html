<!DOCTYPE html>
<html lang="en">
<head>
 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Card</title>


<style>
*{
margin:0; padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{
height:100vh; display:flex;
justify-content:center; align-items:center;
background:linear-gradient(135deg,#006d67,#27b8b3);
}


.container{ width:460px; background:#fff; padding:35px; border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}


.container h1{
text-align:center;
 
color:#006d67; margin-bottom:30px;
}


input{
width:100%; padding:15px; margin-bottom:22px;
border:2px solid #0a9b95; border-radius:8px;
font-size:20px; outline:none;
}


input:focus{
border-color:#006d67;
}


button{ width:100%; padding:15px;
background:#00897b; color:white; border:none;
border-radius:8px; font-size:22px; cursor:pointer; margin-bottom:30px;
}
 
button:hover{ background:#006d67;
}


.profile{ background:#dff0f3; border:2px solid #0a9b95; border-radius:12px; padding:20px;
}


.profile h2{
text-align:center; color:#006d67; margin-bottom:20px;
}


.profile p{
font-size:28px; margin:15px 0; font-weight:bold;
}


.profile span{ color:#000;
font-weight:normal;
}
</style>


</head>
 
<body>


<div class="container">


<h1>Student Profile Card</h1>


<input type="text" id="name" placeholder="Enter Student Name">


<input type="text" id="roll" placeholder="Enter Roll Number">


<input type="number" id="marks" placeholder="Enter Marks">


<button onclick="displayProfile()">Display</button>


<div class="profile">


<h2>Student Profile</h2>


<p>Name : <span id="displayName"></span></p>


<p>Roll No : <span id="displayRoll"></span></p>


<p>Marks : <span id="displayMarks"></span></p>


<p>Grade : <span id="displayGrade"></span></p>


</div>


</div>
 
<script>


function displayProfile(){


let name=document.getElementById("name").value; let roll=document.getElementById("roll").value;
let marks=parseInt(document.getElementById("marks").value);


let grade="";


if(marks>=90){ grade="A+";
}
else if(marks>=80){ grade="A";
}
else if(marks>=70){ grade="B";
}
else if(marks>=60){ grade="C";
}
else if(marks>=50){ grade="D";
}
else{
grade="Fail";
}


document.getElementById("displayName").innerHTML=name;
 
document.getElementById("displayRoll").innerHTML=roll; document.getElementById("displayMarks").innerHTML=marks; document.getElementById("displayGrade").innerHTML=grade;

}


</script>


</body>
</html>
